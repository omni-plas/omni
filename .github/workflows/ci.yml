name: Omni CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q omni
      - run: python -m pytest -q
      - run: omni --help
      - run: omni validate examples/hello.oi
      - run: omni build examples/hello.oi --output /tmp/hello.omni-artifact
      - run: omni language-pack examples/languages/futurelang.json
      - run: omni target-pack examples/targets/future-os.json

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: omni --help
      - run: omni validate examples/hello.oi
      - run: omni language-pack examples/languages/futurelang.json
      - run: omni target-pack examples/targets/future-os.json
