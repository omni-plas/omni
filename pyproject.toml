[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-engine"
version = "0.1.0"
description = "Universal Digital Creation & Compilation Engine core"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
omni = "omni.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["omni*"]
